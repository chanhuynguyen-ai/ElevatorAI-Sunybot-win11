name: CI

on:
  push:
  pull_request:

jobs:
  python-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/vision/requirements/dev.txt
          pip install -r services/agent/requirements.txt pytest
          pip install -r services/gateway/requirements.txt pytest
      - name: Vision tests
        run: PYTHONPATH=services/vision/src pytest -q services/vision/tests
      - name: Agent tests
        run: PYTHONPATH=services/agent/src pytest -q services/agent/tests
      - name: Gateway tests
        run: PYTHONPATH=services/gateway/src pytest -q services/gateway/tests
      - name: Repository hygiene
        run: python scripts/check_repo.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [python-services, web]
    steps:
      - uses: actions/checkout@v4
      - name: Configure demo environment
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config >/dev/null
      - name: Start demo stack
        run: docker compose up -d --build
      - name: Wait for Gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: HTTP smoke test
        run: python scripts/smoke_http.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
