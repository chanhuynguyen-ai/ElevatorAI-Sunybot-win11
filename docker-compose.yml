services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elevator_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevator_ai -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro

  vision:
    build: ./services/vision
    environment:
      CV_BACKEND: ${CV_BACKEND:-mock}
      CAMERA_SOURCE: ${CAMERA_SOURCE:-mock}
      CV_DB_ENABLED: "true"
      ENABLE_POSE: ${ENABLE_POSE:-false}
      ENABLE_FACE: ${ENABLE_FACE:-false}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: elevator_cv
      PG_USER: elevator_ai
      PG_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      API_PORT: 8010
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build: ./services/agent
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: elevator_ai
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      DB_NAME: elevator_llm
      ELEVATOR_CV_DB_NAME: elevator_cv
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      API_PORT: 8020
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./services/gateway
    environment:
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://host.docker.internal:8010}
      AGENT_SERVICE_URL: http://agent:8020
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: elevator_ai
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      ELEVATOR_CV_DB_NAME: elevator_cv
      ELEVATOR_LLM_DB_NAME: elevator_llm
    ports:
      - "8000:8000"
    depends_on:
      - agent

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:8080"
    depends_on:
      - gateway

volumes:
  postgres_data:
