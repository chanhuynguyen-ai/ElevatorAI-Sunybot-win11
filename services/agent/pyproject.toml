[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="elevatorai-agent"
version="1.0.0"
description="LLM, RAG and tool-using agent service for ElevatorAI"
requires-python=">=3.9"
dependencies=["fastapi>=0.100,<1","uvicorn>=0.23,<1","requests>=2.31,<3","Unidecode>=1.3,<2"]

[tool.setuptools.packages.find]
where=["src"]
